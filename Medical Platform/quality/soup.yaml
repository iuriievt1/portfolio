# Soupis softwaru třetích stran (SOUP) — opatření M3 ✓ ADR-028.
#
# "Komponenty třetích stran: proč jsou v produktu, co se od nich čeká, kde se sledují jejich vady;
# zdroj pro SBOM" ✓ ADR-028 kap. „Kde soubory žijí".
#
# VZTAH K SBOM ✓ rozhodnutí vedení 16. 9. 2026 k balíčku předání vývoji a K1 (nález review R-075),
# rozpis docs/spec/vydani-sbom-a-brany.md kap. 4.2:
# - SBOM vzniká z hotových artefaktů (brána B4 ✓ ADR-001 ř. 28). Tento soubor SBOM NEVYTVÁŘÍ,
#   jen ho doplňuje o původ a o tři pole M3. „Zdroj pro SBOM" z ADR-028 znamená zdroj těchto polí.
# - Vedou se tu jen PŘÍMÉ závislosti projektů workspace (to, co stojí v jejich package.json)
#   a komponenty MIMO SPRÁVCE BALÍČKŮ (fork knihovny DIMSE, Tesseract a jazykové modely, runtime
#   Node.js, obraz PostgreSQL ✓ ADR-041 bod d), obraz úložiště klinického záznamu a obraz mezipaměti
#   ✓ ADR-042 bod 7) a Nx s pluginy ✓ ADR-033 bod 2. Tranzitivní závislosti jsou jen v SBOM.
# - Obraz úložiště, obraz mezipaměti a @medplum/* nese profil MOÚ od účinnosti číslovaného
#   dodatku (CAP-012-R04 ✓ rozhodnutí vedení 19. 9. 2026, D30); dodatek je podepsaný 6. 10. 2026.
# - Objektové úložiště klinického záznamu (D31, CAP-029-R30) je další komponenta třetí strany,
#   jejíž produkt není vybraný ⚠ Q-141; do rozhodnutí je jen v open_items a záznam nemá.
# - Kontrola, že každá taková komponenta ze SBOM má záznam tady, je návrh veevoy (?).
#
# Každá komponenta řešení je v SBOM ✓ NAB-471 a ve 24hodinovém režimu zranitelností
# ✓ TS-110, TS-113, SML-053, SML-056, má uzamčenou verzi ✓ NAB-468 a verzi podporovanou výrobcem
# bez konce životnosti ✓ NAB-467.
#
# TENHLE SOUBOR ZATÍM NENÍ ÚPLNÝ. Vede nástroje sestavení (ADR-033 bod 2, CAP-029-R25 ✓ CHG-017)
# a běhové závislosti schválené vlastníkem hranice jádra (ADR-041 bod a). Komponenty mimo správce
# balíčků a nástroje kontraktu se doplní ručně se třemi poli (seznam „open_items" níž); verze jsou
# podle pnpm-lock.yaml.

components:
  - name: nx
    version: "23.2.1"
    role: build-tool
    in_image: false          # v obrazu serveru Nx není ✓ ADR-033 bod 2, ADR-011 ř. 39
    in_sbom: true             # ✓ ADR-033 bod 2, CAP-029-R25 ✓ CHG-017
    vulnerability_regime: 24h # ✓ TS-113, SML-056
    license: MIT
    inclusion_rationale: >-
      Orchestrátor sestavení monorepa ✓ ADR-033 bod 1. Rozhoduje o tom, co se do vydání dostane,
      proto je v soupisu i v režimu zranitelností — jinak by nástroj stál mimo oba.
    expected_function: >-
      Sestaví a seřadí cíle projektů a vynutí, že brány nikdy neběží z mezipaměti
      ✓ ADR-033 bod 3. Cíle samy zůstávají skripty projektů ✓ ADR-033 „Cesta zpět".
    issue_tracker: https://github.com/nrwl/nx/security/advisories
    plugins: []       # žádné; useInferencePlugins: false v nx.json

