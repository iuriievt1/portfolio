# Nesplněné položky, které sem patří, ale zatím nejsou:
open_items:
  - "Nástroje sestavení administrace a mobilní aplikace (vite, @vitejs/plugin-react, tailwindcss 4.3.3, @tailwindcss/vite 4.3.3, shadcn 4.16.1) — ADR-041 bod a) je neschvaluje jako běhové závislosti; zda potřebují záznam, rozhodnuté není (?)."
  - "Nástroje kontraktu API pro bránu B16 (@redocly/cli, openapi-typescript)."
  - "Balíčky jen s typy (@types/*) — zda potřebují záznam, když nic nespouštějí, rozhodnuté není (?)."
  - "Fork knihovny DIMSE @veevoy/dcmjs-dimse a @veevoy/dcmjs ✓ Q-035 — záznamy výš; od adaptéru @ansora/vulna-adapter-dicom-dimse je v obrazu serveru (vendor/, jen zdrojové soubory s licencí) a v SBOM obrazu s rodokmenem (CycloneDX pedigree) a dodavatelem veevoy ✓ ADR-017, profil MOÚ ho vede ve vendoredPackages. Distribuce forku (privátní registry, politika podpory, SECURITY.md) do předání ✓ ADR-017."
  - "Uzamčený strom závislostí sestavení mobilní aplikace ✓ ADR-001 ř. 28 — v SBOM, tady jen přímé závislosti."
  - "Forma odlišení nástroje sestavení v SBOM (třetí část, nebo role) — návrh veevoy (?) podle CAP-029-R25."
  - "Kontrola souladu tohoto souboru se SBOM — návrh veevoy (?), branou jen změnou CAP-029."
  - "Obraz úložiště a obraz Valkey: licence všech balíčků uzávěru dohledat před předáním (CAP-029-R30); průchod bránou B11 ověří hypotéza H10 spiku S-MEDPLUM; druhé místo sledování vad úložiště — poznámky k vydání každého patche (CAP-029-R29)."
  - "Objektové úložiště klinického záznamu — komponenta s rozhraním S3, do které úložiště klinického záznamu ukládá Binary snímků, stránek dokumentů a náhledů (CAP-021-R36) ✓ rozhodnutí vedení 19. 9. 2026 (D31), ADR-042 (doplnění 19. 9. 2026, D31). Je-li dodané jako obraz instance, je to pátý obraz: oficiální, připnutý digestem, s oddílem SBOM, skenem, stropem, bránou zakázaného obsahu a 24hodinovým režimem s účinnou mitigací (CAP-029-R30, CAP-029-R31, scénář CAP-029-S23). OTEVŘENÉ ⚠ Q-141: produkt, licence (rodina AGPL u síťové služby posoudit právně ✓ CAP-029-R24), původ proti varování NÚKIB (CAP-029-R10 ⚠ Q-115), místo sledování vad, zda je obrazem instance, nebo službou odběratele, a šifrování na straně úložiště ✓ Q-112 (rozhodnuto 20. 9. 2026, D32: šifrování dat v klidu na serveru zůstává mimo rozsah verze 1.0 ✓ ADR-050 bod 16). Záznam s verzí, licencí a důvodem až po rozhodnutí vedení podle spiku S-MEDPLUM; do profilu MOÚ až po účinnosti číslovaného dodatku (CAP-012-R04). Poznámka k otevřené komponentě, ne stav (?)."
