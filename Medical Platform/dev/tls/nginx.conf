# Dev TLS in front of the API process, which does not terminate TLS itself. TLS 1.2 and 1.3 only
# ✓ CAP-010-R01, CAP-010-R04; only AEAD suites with forward secrecy ✓ CAP-010-R03 ⚠ Q-019.
events {}

http {
	server {
		listen 8443 ssl;

		ssl_certificate /etc/nginx/certs/server.crt;
		ssl_certificate_key /etc/nginx/certs/server.key;
		ssl_protocols TLSv1.2 TLSv1.3;
		ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-RSA-AES128-GCM-SHA256;
		ssl_prefer_server_ciphers on;
		ssl_ecdh_curve X25519:prime256v1:secp384r1;
		ssl_session_tickets off;

		# The largest request body the API accepts ✓ docs/spec/konfigurace-a-profily.md kap. 2.7.
		client_max_body_size 64m;

		# Docker's DNS answers for the host with IPv4 and IPv6; the bridge has no IPv6 route.
		resolver 127.0.0.11 ipv6=off valid=30s;
		set $api http://host.docker.internal:3000;
		set $storage http://clinical-record:8103;

		location / {
			proxy_pass $api;
			proxy_http_version 1.1;
			# The device proof names the URL the app called, with its port ✓ RFC 9449, so the API needs
			# the original host and scheme.
			proxy_set_header Host $http_host;
			proxy_set_header X-Forwarded-Proto https;
			proxy_set_header X-Forwarded-For $remote_addr;
			proxy_request_buffering off;
			proxy_read_timeout 300s;
		}

		# CAP-011-R02, CAP-020-R22, ADR-053 (doplnění 2026-09-24) bod 1
		location /storage/ {
			limit_except GET {
				deny all;
			}
			proxy_pass $storage$uri$is_args$args;
			proxy_http_version 1.1;
			proxy_set_header Host $http_host;
			proxy_set_header X-Forwarded-Proto https;
			proxy_set_header X-Forwarded-For $remote_addr;
		}
	}
}
