@version: 4.12

source s_tls {
	syslog(
		port(6514)
		transport("tls")
		tls(
			key-file("/etc/syslog-ng/certs/server.key")
			cert-file("/etc/syslog-ng/certs/server.crt")
			peer-verify(optional-untrusted)
		)
	);
};

source s_tcp_octet_counting {
	syslog(port(601) transport("tcp"));
};

source s_tcp_newline {
	network(port(514) transport("tcp") flags(syslog-protocol));
};

source s_udp {
	syslog(port(514) transport("udp"));
};

destination d_received {
	file("/var/log/received/messages.log" template("${ISODATE} ${HOST} ${MSGHDR}${SDATA} ${MESSAGE}\n") create-dirs(yes));
};

log {
	source(s_tls);
	source(s_tcp_octet_counting);
	source(s_tcp_newline);
	source(s_udp);
	destination(d_received);
};
