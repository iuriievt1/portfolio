version: 1
metadata:
  name: vulna
entries:
  - model: authentik_core.group
    id: users
    identifiers:
      name: vulna-users
    attrs:
      name: vulna-users
  - model: authentik_core.group
    id: clinicians
    identifiers:
      name: vulna-clinicians
    attrs:
      name: vulna-clinicians
  - model: authentik_core.group
    id: administrators
    identifiers:
      name: vulna-administrators
    attrs:
      name: vulna-administrators
  - model: authentik_core.user
    identifiers:
      username: jana.novakova
    attrs:
      name: Jana Nováková
      email: jana.novakova@vulna.invalid
      password: vulna
      is_active: true
      attributes:
        personal_number: "000101"
      groups:
        - !KeyOf users
        - !KeyOf clinicians
  - model: authentik_core.user
    identifiers:
      username: petr.svoboda
    attrs:
      name: Petr Svoboda
      email: petr.svoboda@vulna.invalid
      password: vulna
      is_active: true
      attributes:
        personal_number: "000102"
      groups:
        - !KeyOf users
        - !KeyOf administrators
  - model: authentik_core.user
    identifiers:
      username: karel.blokovany
    attrs:
      name: Karel Blokovaný
      email: karel.blokovany@vulna.invalid
      password: vulna
      is_active: false
      attributes:
        personal_number: "000103"
      groups:
        - !KeyOf users
        - !KeyOf clinicians
  - model: authentik_providers_oauth2.scopemapping
    id: personal_number
    identifiers:
      name: vulna-personal-number
    attrs:
      name: vulna-personal-number
      scope_name: personal_number
      expression: |
        return {"personal_number": request.user.attributes.get("personal_number", "")}
  - model: authentik_providers_oauth2.scopemapping
    id: groups
    identifiers:
      name: vulna-groups
    attrs:
      name: vulna-groups
      scope_name: groups
      expression: |
        return {"groups": [group.name for group in request.user.ak_groups.all()]}
  - model: authentik_policies_expression.expressionpolicy
    id: fresh_login
    identifiers:
      name: vulna-fresh-login
    attrs:
      name: vulna-fresh-login
      expression: |
        # Q-007
        request.http_request.session["authentik/providers/oauth2/last_login_uid"] = "vulna-fresh-login"
        return True
  - model: authentik_stages_user_login.userloginstage
    id: login
    identifiers:
      name: vulna-authentication-login
    attrs:
      name: vulna-authentication-login
      session_duration: minutes=1
      remember_me_offset: seconds=0
      terminate_other_sessions: false
  - model: authentik_flows.flow
    id: authentication
    identifiers:
      slug: vulna-authentication
    attrs:
      name: Welcome to authentik!
      title: Welcome to authentik!
      slug: vulna-authentication
      designation: authentication
      authentication: none
      layout: stacked
      policy_engine_mode: any
      denied_action: message_continue
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf authentication
      policy: !KeyOf fresh_login
    attrs:
      order: 0
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf authentication
      order: 10
    attrs:
      stage: !Find [authentik_stages_identification.identificationstage, [name, default-authentication-identification]]
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf authentication
      order: 20
    attrs:
      stage: !Find [authentik_stages_password.passwordstage, [name, default-authentication-password]]
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf authentication
      order: 30
    attrs:
      stage: !Find [authentik_stages_authenticator_validate.authenticatorvalidatestage, [name, default-authentication-mfa-validation]]
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf authentication
      order: 100
    attrs:
      stage: !KeyOf login
  - model: authentik_providers_oauth2.oauth2provider
    id: provider
    identifiers:
      name: ansora-vulna-server
    attrs:
      name: ansora-vulna-server
      client_type: confidential
      client_id: ansora-vulna-server
      client_secret: vulna-dev-client-secret
      grant_types:
        - authorization_code
        - refresh_token
      redirect_uris:
        - matching_mode: strict
          url: http://localhost:3000/api/v1/login/oidc/return
        - matching_mode: strict
          url: http://localhost:5173/api/admin/v1/login/oidc/callback
        - matching_mode: strict
          url: http://localhost:3000/api/admin/v1/login/oidc/callback
      authentication_flow: !KeyOf authentication
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      access_token_validity: minutes=15
      refresh_token_validity: days=30
      sub_mode: hashed_user_id
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-offline_access]]
        - !KeyOf personal_number
        - !KeyOf groups
  - model: authentik_core.application
    identifiers:
      slug: vulna
    attrs:
      name: Ansora Vulna
      slug: vulna
      provider: !KeyOf provider
