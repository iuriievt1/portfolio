
name: monthly-scan

on:
  schedule:
    - cron: "0 5 1 * *"
  workflow_dispatch:

env:
  NX_NO_CLOUD: "true"

jobs:
  scan:
    runs-on:
      group: default
      labels: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: obraz serveru
        run: pnpm image:build
      - name: B9 — sken obrazu
        run: pnpm gate:image
      - name: SBOM
        run: pnpm gate:sbom
      - name: sken mobilní aplikace
        run: pnpm scan:mobile
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sbom
          path: dist/sbom/
