packages:
  - apps/*
  - packages/*

engineStrict: true
savePrefix: ''

# Install scripts of dependencies run only when they are allowed here.
allowBuilds:
  # Ships prebuilt binaries as optional dependencies, the script only builds from source.
  '@parcel/watcher': false
  # Downloads the engine that Prisma uses for migrations.
  '@prisma/engines': true
  # Only sends install statistics (comes with the Swagger UI files).
  '@scarf/scarf': false
  # Ships prebuilt binaries as optional dependencies, the script only downloads a fallback.
  '@swc/core': false
  # The script only checks the Node.js version, which pnpm already does (engineStrict).
  prisma: false

overrides:
  lightningcss: 1.30.1

catalog:
  '@eslint/js': 9.39.5
  '@tailwindcss/postcss': 4.3.4
  '@types/node': 24.19.2
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  eslint: 9.39.5
  eslint-config-expo: 58.0.4
  eslint-config-next: 16.4.5
  eslint-config-prettier: 10.1.8
  eslint-plugin-check-file: 3.3.2
  globals: 17.14.0
  lucide-react: 1.72.0
  next: 16.4.5
  next-intl: 4.14.9
  react: 19.3.0
  react-dom: 19.3.0
  tailwindcss: 4.3.4
  typescript: 6.0.3
  typescript-eslint: 8.72.1
  vite: 8.3.6
  vitest: 5.1.0
