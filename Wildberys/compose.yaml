# Local services for development. Values come from .env (template: .env.example).
# Every port is bound to 127.0.0.1, so nothing is reachable from the network.
name: bluberi

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Copy .env.example to .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env}
      POSTGRES_DB: ${POSTGRES_DB:?Copy .env.example to .env}
    ports:
      - 127.0.0.1:${POSTGRES_PORT:?Copy .env.example to .env}:5432
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready --username "$$POSTGRES_USER" --dbname "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8.10.3-alpine
    # BullMQ needs noeviction, otherwise Redis may drop queued jobs when memory is full.
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports:
      - 127.0.0.1:${REDIS_PORT:?Copy .env.example to .env}:6379
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  meilisearch:
    image: getmeili/meilisearch:v1.56.2
    environment:
      MEILI_ENV: development
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?Copy .env.example to .env}
      MEILI_NO_ANALYTICS: 'true'
    ports:
      - 127.0.0.1:${MEILI_PORT:?Copy .env.example to .env}:7700
    volumes:
      - meilisearch-data:/meili_data
    healthcheck:
      test: ['CMD', 'curl', '--fail', '--silent', 'http://127.0.0.1:7700/health']
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible file storage. Production uses Cloudflare R2 with the same S3 API.
  storage:
    image: rustfs/rustfs:1.0.5
    environment:
      RUSTFS_ACCESS_KEY: ${STORAGE_ACCESS_KEY:?Copy .env.example to .env}
      RUSTFS_SECRET_KEY: ${STORAGE_SECRET_KEY:?Copy .env.example to .env}
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: 'true'
    ports:
      - 127.0.0.1:${STORAGE_PORT:?Copy .env.example to .env}:9000
      - 127.0.0.1:${STORAGE_CONSOLE_PORT:?Copy .env.example to .env}:9001
    volumes:
      - storage-data:/data
    healthcheck:
      test: ['CMD', 'curl', '--fail', '--silent', 'http://127.0.0.1:9000/health']
      interval: 5s
      timeout: 5s
      retries: 10

  # Catches every outgoing email and shows it in a web inbox. Nothing is delivered.
  mailpit:
    image: axllent/mailpit:v1.33.1
    ports:
      - 127.0.0.1:${MAILPIT_SMTP_PORT:?Copy .env.example to .env}:1025
      - 127.0.0.1:${MAILPIT_UI_PORT:?Copy .env.example to .env}:8025

volumes:
  postgres-data:
  redis-data:
  meilisearch-data:
  storage-data:
