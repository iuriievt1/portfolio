name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to the same pull request cancels its run that is still in progress.
# Runs on main have their own group and are never cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NEXT_TELEMETRY_DISABLED: 1
  TURBO_TELEMETRY_DISABLED: 1
  # The build of the store needs its public address, see apps/web/.env.example.
  SITE_URL: http://localhost:3000

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Actions are pinned to a commit, the comment shows the release it belongs to.
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Check types
        run: pnpm typecheck

      # The API tests run on a real database, a real file storage and a real Redis, the same ones as in local development.
      - name: Start PostgreSQL, the file storage and Redis
        run: |
          cp .env.example .env
          docker compose up --detach --wait postgres storage redis

      - name: Run tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Check that the API client is up to date
        run: |
          pnpm api-client:generate
          if [ -n "$(git status --porcelain -- packages/api-client)" ]; then
            git status --short -- packages/api-client
            echo "::error::packages/api-client is out of date. Run pnpm api-client:generate and commit the result."
            exit 1
          fi
